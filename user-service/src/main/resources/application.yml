server:
  port: ${PORT:8082}
  address: 0.0.0.0

spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/learning_platform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      username: ${SPRING_REDIS_USERNAME:default}
      password: ${SPRING_REDIS_PASSWORD:}
  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

site:
  name: Gaurav
  title: Gaurav's CDN Learning Platform

app:
  base-url: ${APP_BASE_URL:http://localhost:8082}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  security:
    master-admin-email: ${MASTER_ADMIN_EMAIL:serversidegaurav@gmail.com}
    cookie-secure: ${COOKIE_SECURE:false}

jwt:
  secret: ${JWT_SECRET:default_jwt_secret_key_for_development_environment_only}
  expiration: ${JWT_EXPIRATION:86400000}

brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:serversidegaurav@gmail.com}
  sender-name: ${BREVO_SENDER_NAME:Gaurav's CDN Learning Platform}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
