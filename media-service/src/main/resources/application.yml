server:
  port: ${PORT:8084}
  address: 0.0.0.0

spring:
  application:
    name: media-service
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:2GB}
      max-request-size: ${MAX_REQUEST_SIZE:2GB}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/learning_platform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT:https://account-id.r2.cloudflarestorage.com}
    access-key: ${R2_ACCESS_KEY:dev-access-key}
    secret-key: ${R2_SECRET_KEY:dev-secret-key}
    bucket-name: ${R2_BUCKET_NAME:learning-platform}
    cdn-url: ${R2_CDN_URL:https://pub-demo.r2.dev}

local:
  uploads-url: ${LOCAL_UPLOADS_URL:http://localhost:8084/uploads/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
