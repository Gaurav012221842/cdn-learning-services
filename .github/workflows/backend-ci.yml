name: Microservices Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'pom.xml'
      - 'learning-common/**'
      - 'api-gateway/**'
      - 'user-service/**'
      - 'course-service/**'
      - 'media-service/**'
      - 'payment-service/**'
      - 'enrollment-service/**'
      - 'progress-service/**'
      - 'video-worker/**'
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-verify-microservices:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build All Microservices & Shared Libraries
        run: mvn clean test-compile -DskipTests
